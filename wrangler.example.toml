name = "twitter-watcher"
main = "src/worker.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Public fetch surface is intentional: /trigger, /api/refresh, /api/discover, /api/promote, /api/watch-targets
# All routes are gated by the X-Trigger-Token header. Unmatched routes return 404.
workers_dev = true
preview_urls = false

# Bundle prompts/*.md as strings at build time
# (used by `import briefingPrompt from "../prompts/briefing.md"` etc.)
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# D1 — used for watch_targets, posts, briefings.
# Run `wrangler d1 create twitter-watcher` after `wrangler login` and paste the
# returned database_id below before the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "twitter-watcher"
database_id = "REPLACE_WITH_D1_ID"

# Briefing — Sun–Fri 10:00 UTC ≈ 05:00–06:00 ET (accept DST drift). Skips Saturday.
# Each run covers the window since the last posted briefing (Sunday reaches back
# over Saturday). To revert to weekly, change this to "0 10 * * 1".
[triggers]
crons = ["0 10 * * 0-5"]

# Secrets — set via `wrangler secret put` (NOT defined here):
#   ANTHROPIC_API_KEY        Anthropic API key (cap monthly budget in console)
#   DISCORD_WEBHOOK_URL      Discord webhook URL for digest delivery
#   TRIGGER_TOKEN            Long random string for X-Trigger-Token header on /trigger, /api/*
#   TWITTERAPI_IO_KEY        twitterapi.io API key — tweet data source (ingest + discover)
